name: test

# Every push and pull request runs the suite. This is deliberately the only
# thing CI does: building the installer needs the payload sources, the ReShade
# installer and the offline signing key, none of which belong on a shared
# runner. Releases are cut locally with npm run release.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
